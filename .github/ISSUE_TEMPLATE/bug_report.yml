name: Bug report
description: Something in the tokens pipeline, the generator, or the Figma plugin is not working as documented.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please fill in as much as you can —
        it saves a round trip.

  - type: dropdown
    id: direction
    attributes:
      label: Which direction of the bridge?
      description: See the [architecture diagram](../../README.md#architecture).
      options:
        - "Direction A — Figma Variables → tokens (pull/build)"
        - "Direction B — registry → Storybook → Figma"
        - "Both"
        - "Not applicable (docs, CI, tooling)"
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - Angular
        - Vue
        - N/A
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: v20.x.x
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: design-bridge version
      description: The version of the affected package (`@design-bridge/tokens`, `@design-bridge/registry`, `@design-bridge/generator`, or the plugin) from `package.json`.
      placeholder: 0.1.0
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact command you ran and the full error output, if any.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        Minimal steps to reproduce — ideally a minimal `registry.json` or token
        input file. Redact any real Figma file key or token.
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I did not paste a real FIGMA_TOKEN or file key anywhere in this report.
          required: true
