<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-label="Diagram of the Figma stage: before, story.to.design has pasted eleven loose frames onto one page; after, the Design Bridge organizer has rebuilt them into three Component Sets with variant properties, on one page per family.">
  <rect width="940" height="430" fill="#11141b"/>
  <text x="24" y="32" fill="#d6dae4" font-size="15" font-weight="700">Step 19 — inside Figma (diagram, not a screenshot)</text>
  <text x="24" y="52" fill="#79839a" font-size="11">Figma Variables and the story.to.design import both need an Enterprise plan and a paid licence, so this stage is drawn rather than faked.</text>
  <text x="24" y="68" fill="#79839a" font-size="11">Every name and property below is read verbatim from the real generated figma-organizer.json in this repository.</text>

  <rect x="24" y="86" width="418" height="322" rx="8" fill="#1b1f2a" stroke="#2a3040"/>
  <text x="44" y="112" fill="#f7768e" font-size="12" font-weight="700">BEFORE — right after story.to.design pastes</text>
  <text x="44" y="130" fill="#79839a" font-size="10">one page · 11 loose FRAMEs</text>
  <g font-size="9.5" fill="#d6dae4">
    <rect x="44" y="144" width="190" height="26" rx="4" fill="#11141b" stroke="#2a3040"/><text x="52" y="161">acme/atoms/Icon/Check</text>
    <rect x="242" y="144" width="190" height="26" rx="4" fill="#11141b" stroke="#2a3040"/><text x="250" y="161">acme/atoms/Icon/Alert</text>
    <rect x="44" y="176" width="190" height="26" rx="4" fill="#11141b" stroke="#2a3040"/><text x="52" y="193">acme/atoms/Icon/Arrow</text>
    <rect x="242" y="176" width="190" height="26" rx="4" fill="#11141b" stroke="#2a3040"/><text x="250" y="193">acme/atoms/Button/Primary</text>
    <rect x="44" y="208" width="190" height="26" rx="4" fill="#11141b" stroke="#2a3040"/><text x="52" y="225">acme/atoms/Button/Ghost</text>
    <rect x="242" y="208" width="190" height="26" rx="4" fill="#11141b" stroke="#2a3040"/><text x="250" y="225">acme/atoms/Button/Small</text>
    <rect x="44" y="240" width="190" height="26" rx="4" fill="#11141b" stroke="#2a3040"/><text x="52" y="257">acme/molecules/Card/Default</text>
    <rect x="242" y="240" width="190" height="26" rx="4" fill="#11141b" stroke="#2a3040"/><text x="250" y="257" fill="#79839a">… 4 more</text>
  </g>
  <text x="44" y="296" fill="#f7768e" font-size="10">✗ each one is an independent FRAME, not a component</text>
  <text x="44" y="314" fill="#f7768e" font-size="10">✗ no variant properties — a designer cannot switch `variant`</text>
  <text x="44" y="332" fill="#f7768e" font-size="10">✗ nothing is publishable to a team library</text>
  <text x="44" y="350" fill="#f7768e" font-size="10">✗ import them all at once and Card carries a detached copy</text>
  <text x="58" y="366" fill="#f7768e" font-size="10">of Button instead of a live instance</text>

  <text x="462" y="238" fill="#7aa2f7" font-size="24">→</text>
  <text x="452" y="264" fill="#7aa2f7" font-size="9">Organise</text>
  <text x="456" y="276" fill="#7aa2f7" font-size="9">selection</text>

  <rect x="510" y="86" width="406" height="322" rx="8" fill="#1b1f2a" stroke="#2a3040"/>
  <text x="530" y="112" fill="#9ece6a" font-size="12" font-weight="700">AFTER — Design Bridge organizer</text>
  <text x="530" y="130" fill="#79839a" font-size="10">3 COMPONENT_SETs, one page per family</text>
  <g font-size="9.5">
    <rect x="530" y="144" width="366" height="52" rx="4" fill="#11141b" stroke="#9ece6a"/>
    <text x="540" y="161" fill="#d6dae4">▣ Icon — page "DS / atoms" · layer 0 · 3 variants</text>
    <text x="540" y="177" fill="#79839a">name=check | name=alert | name=arrow, size=24</text>

    <rect x="530" y="204" width="366" height="66" rx="4" fill="#11141b" stroke="#9ece6a"/>
    <text x="540" y="221" fill="#d6dae4">▣ Button — page "DS / atoms" · layer 1 · 6 variants</text>
    <text x="540" y="237" fill="#79839a">variant=primary | secondary | ghost</text>
    <text x="540" y="252" fill="#79839a">variant=primary, icon=arrow · disabled=true · size=sm</text>

    <rect x="530" y="278" width="366" height="52" rx="4" fill="#11141b" stroke="#9ece6a"/>
    <text x="540" y="295" fill="#d6dae4">▣ Card — page "DS / molecules" · layer 2 · 2 variants</text>
    <text x="540" y="311" fill="#79839a">title=… | title=…, action=Upgrade</text>
  </g>
  <text x="530" y="352" fill="#9ece6a" font-size="10">✓ real COMPONENT_SETs with named variant properties</text>
  <text x="530" y="370" fill="#9ece6a" font-size="10">✓ layers imported in order, so Card nests a live Button instance</text>
  <text x="530" y="388" fill="#9ece6a" font-size="10">✓ ready to publish as a team library</text>
</svg>
