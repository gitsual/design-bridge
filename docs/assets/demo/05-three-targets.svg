<svg xmlns="http://www.w3.org/2000/svg" width="771" height="510" viewBox="0 0 771 510" role="img" aria-label="Step 5 — the same token in three targets, and why they differ">
  <title>Step 5 — the same token in three targets, and why they differ</title>
  <rect width="771" height="510" rx="10" fill="#11141b" stroke="#2a303d"/>
  <rect width="771" height="42" rx="10" fill="#1b1f2a"/>
  <rect y="32" width="771" height="10" fill="#1b1f2a"/>
  <line x1="0" y1="42" x2="771" y2="42" stroke="#2a303d"/>
  <circle cx="22" cy="21" r="6" fill="#f7768e" opacity=".85"/><circle cx="41" cy="21" r="6" fill="#e0af68" opacity=".85"/><circle cx="60" cy="21" r="6" fill="#9ece6a" opacity=".85"/>
  <text x="385.5" y="26" fill="#79839a" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Step 5 — the same token in three targets, and why they differ</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <text x="20" y="52" fill="#79839a" xml:space="preserve"># dist/tokens.css  — aliases stay as var(), so themes cascade</text>
    <text x="20" y="92" fill="#d6dae4" xml:space="preserve">  8:  --ds-palette-blue-500: #3b82f6;</text>
    <text x="20" y="112" fill="#d6dae4" xml:space="preserve">  14:  --ds-semantic-action: var(--ds-palette-blue-500);</text>
    <text x="20" y="132" fill="#d6dae4" xml:space="preserve">  15:  --ds-semantic-action-hover: var(--ds-palette-blue-600);</text>
    <text x="20" y="152" fill="#d6dae4" xml:space="preserve">  19:  --ds-spacing-md: 16px;</text>
    <text x="20" y="172" fill="#d6dae4" xml:space="preserve">  35:  --ds-palette-blue-500: #60a5fa;</text>
    <text x="20" y="192" fill="#d6dae4" xml:space="preserve">  41:  --ds-semantic-action: var(--ds-palette-blue-500);</text>
    <text x="20" y="232" fill="#79839a" xml:space="preserve"># dist/theme.light.scss  — aliases RESOLVED: Sass cannot follow a runtime var()</text>
    <text x="20" y="272" fill="#7aa2f7" xml:space="preserve">  $ds-palette-blue-500: #3b82f6;</text>
    <text x="20" y="292" fill="#7aa2f7" xml:space="preserve">  $ds-semantic-action: #3b82f6;</text>
    <text x="20" y="312" fill="#7aa2f7" xml:space="preserve">  $ds-semantic-action-hover: #2563eb;</text>
    <text x="20" y="332" fill="#7aa2f7" xml:space="preserve">  $ds-spacing-md: 16px;</text>
    <text x="20" y="372" fill="#79839a" xml:space="preserve"># dist/theme.light.ts  — points at the custom property, never a literal</text>
    <text x="20" y="412" fill="#d6dae4" xml:space="preserve">    paletteBlue500: &apos;var(--ds-palette-blue-500)&apos;,</text>
    <text x="20" y="432" fill="#d6dae4" xml:space="preserve">    semanticAction: &apos;var(--ds-semantic-action)&apos;,</text>
    <text x="20" y="452" fill="#d6dae4" xml:space="preserve">    semanticActionHover: &apos;var(--ds-semantic-action-hover)&apos;,</text>
    <text x="20" y="472" fill="#d6dae4" xml:space="preserve">    spacingMd: &apos;var(--ds-spacing-md)&apos;,</text>
  </g>
</svg>
