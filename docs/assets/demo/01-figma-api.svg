    <text x="20" y="532" fill="#d6dae4" xml:space="preserve">        &quot;name&quot;: &quot;palette/blue/500&quot;,</text>
    <text x="20" y="552" fill="#d6dae4" xml:space="preserve">        &quot;resolvedType&quot;: &quot;COLOR&quot;,</text>
    <text x="20" y="572" fill="#d6dae4" xml:space="preserve">        &quot;variableCollectionId&quot;: &quot;VariableCollectionId:1:2&quot;,</text>
    <text x="20" y="592" fill="#d6dae4" xml:space="preserve">        &quot;description&quot;: &quot;Brand blue&quot;,</text>
    <text x="20" y="612" fill="#d6dae4" xml:space="preserve">        &quot;valuesByMode&quot;: {</text>
