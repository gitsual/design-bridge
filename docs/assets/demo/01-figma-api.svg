    <text x="20" y="232" fill="#d6dae4" xml:space="preserve">        &quot;modes&quot;: [</text>
    <text x="20" y="252" fill="#d6dae4" xml:space="preserve">          {</text>
    <text x="20" y="272" fill="#d6dae4" xml:space="preserve">            &quot;modeId&quot;: &quot;1:0&quot;,</text>
    <text x="20" y="292" fill="#d6dae4" xml:space="preserve">            &quot;name&quot;: &quot;light&quot;</text>
    <text x="20" y="312" fill="#d6dae4" xml:space="preserve">          },</text>
    <text x="20" y="332" fill="#d6dae4" xml:space="preserve">          {</text>
    <text x="20" y="352" fill="#d6dae4" xml:space="preserve">            &quot;modeId&quot;: &quot;1:1&quot;,</text>
    <text x="20" y="372" fill="#d6dae4" xml:space="preserve">            &quot;name&quot;: &quot;dark&quot;</text>
    <text x="20" y="392" fill="#d6dae4" xml:space="preserve">          }</text>
    <text x="20" y="412" fill="#d6dae4" xml:space="preserve">        ]</text>
    <text x="20" y="432" fill="#d6dae4" xml:space="preserve">      }</text>
    <text x="20" y="452" fill="#d6dae4" xml:space="preserve">    },</text>
