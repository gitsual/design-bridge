    <text x="20" y="692" fill="#d6dae4" xml:space="preserve">            &quot;b&quot;: 0.965,</text>
    <text x="20" y="712" fill="#d6dae4" xml:space="preserve">            &quot;a&quot;: 1</text>
    <text x="20" y="732" fill="#d6dae4" xml:space="preserve">          },</text>
    <text x="20" y="752" fill="#d6dae4" xml:space="preserve">          &quot;1:1&quot;: {</text>
    <text x="20" y="772" fill="#d6dae4" xml:space="preserve">            &quot;r&quot;: 0.376,</text>
