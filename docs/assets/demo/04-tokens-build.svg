<svg xmlns="http://www.w3.org/2000/svg" width="889" height="330" viewBox="0 0 889 330" role="img" aria-label="Step 4 — build: one stylesheet, plus SCSS, typed TS and a flat map per mode">
  <title>Step 4 — build: one stylesheet, plus SCSS, typed TS and a flat map per mode</title>
  <rect width="889" height="330" rx="10" fill="#11141b" stroke="#2a303d"/>
  <rect width="889" height="42" rx="10" fill="#1b1f2a"/>
  <rect y="32" width="889" height="10" fill="#1b1f2a"/>
  <line x1="0" y1="42" x2="889" y2="42" stroke="#2a303d"/>
  <circle cx="22" cy="21" r="6" fill="#f7768e" opacity=".85"/><circle cx="41" cy="21" r="6" fill="#e0af68" opacity=".85"/><circle cx="60" cy="21" r="6" fill="#9ece6a" opacity=".85"/>
  <text x="444.5" y="26" fill="#79839a" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Step 4 — build: one stylesheet, plus SCSS, typed TS and a flat map per mode</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <text x="20" y="52" fill="#7aa2f7" xml:space="preserve">$ npx design-bridge-tokens build --in tokens/ --out dist/ --prefix ds</text>
    <text x="20" y="92" fill="#d6dae4" xml:space="preserve">Built 2 token file(s) into examples/shared/dist.</text>
    <text x="20" y="132" fill="#7aa2f7" xml:space="preserve">$ eza dist/</text>
    <text x="20" y="172" fill="#d6dae4" xml:space="preserve">  theme.dark.flat.json</text>
    <text x="20" y="192" fill="#d6dae4" xml:space="preserve">  theme.dark.scss</text>
    <text x="20" y="212" fill="#d6dae4" xml:space="preserve">  theme.dark.ts</text>
    <text x="20" y="232" fill="#d6dae4" xml:space="preserve">  theme.light.flat.json</text>
    <text x="20" y="252" fill="#d6dae4" xml:space="preserve">  theme.light.scss</text>
    <text x="20" y="272" fill="#d6dae4" xml:space="preserve">  theme.light.ts</text>
    <text x="20" y="292" fill="#bb9af7" xml:space="preserve">  tokens.css</text>
  </g>
</svg>
