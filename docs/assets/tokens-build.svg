<svg xmlns="http://www.w3.org/2000/svg" width="788" height="550" viewBox="0 0 788 550" role="img" aria-label="design-bridge-tokens — Figma Variables to CSS custom properties">
  <title>design-bridge-tokens — Figma Variables to CSS custom properties</title>
  <rect width="788" height="550" rx="10" fill="#11141b" stroke="#2a303d"/>
  <rect width="788" height="42" rx="10" fill="#1b1f2a"/>
  <rect y="32" width="788" height="10" fill="#1b1f2a"/>
  <line x1="0" y1="42" x2="788" y2="42" stroke="#2a303d"/>
  <circle cx="22" cy="21" r="6" fill="#f7768e" opacity=".85"/><circle cx="41" cy="21" r="6" fill="#e0af68" opacity=".85"/><circle cx="60" cy="21" r="6" fill="#9ece6a" opacity=".85"/>
  <text x="394" y="26" fill="#79839a" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">design-bridge-tokens — Figma Variables to CSS custom properties</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <text x="20" y="52" fill="#7aa2f7" xml:space="preserve">$ npx design-bridge-tokens build --in tokens/ --out dist/ --prefix ds</text>
    <text x="20" y="92" fill="#d6dae4" xml:space="preserve">Built 2 token file(s) into examples/shared/dist.</text>
    <text x="20" y="132" fill="#7aa2f7" xml:space="preserve">$ head -18 dist/tokens.css</text>
    <text x="20" y="172" fill="#d6dae4" xml:space="preserve">/* Generated by design-bridge. Do not edit by hand. */</text>
    <text x="20" y="192" fill="#d6dae4" xml:space="preserve">:root {</text>
    <text x="20" y="212" fill="#bb9af7" xml:space="preserve">  --ds-palette-slate-50: #f8fafc;</text>
    <text x="20" y="232" fill="#bb9af7" xml:space="preserve">  --ds-palette-slate-200: #e2e8f0;</text>
    <text x="20" y="252" fill="#bb9af7" xml:space="preserve">  --ds-palette-slate-600: #475569;</text>
    <text x="20" y="272" fill="#bb9af7" xml:space="preserve">  --ds-palette-slate-900: #0f172a;</text>
    <text x="20" y="292" fill="#d6dae4" xml:space="preserve">  /* Brand blue */</text>
    <text x="20" y="312" fill="#bb9af7" xml:space="preserve">  --ds-palette-blue-500: #3b82f6;</text>
    <text x="20" y="332" fill="#bb9af7" xml:space="preserve">  --ds-palette-blue-600: #2563eb;</text>
    <text x="20" y="352" fill="#bb9af7" xml:space="preserve">  --ds-semantic-surface: var(--ds-palette-slate-50);</text>
    <text x="20" y="372" fill="#bb9af7" xml:space="preserve">  --ds-semantic-text: var(--ds-palette-slate-900);</text>
    <text x="20" y="392" fill="#bb9af7" xml:space="preserve">  --ds-semantic-muted: var(--ds-palette-slate-600);</text>
    <text x="20" y="412" fill="#bb9af7" xml:space="preserve">  --ds-semantic-border: var(--ds-palette-slate-200);</text>
    <text x="20" y="432" fill="#bb9af7" xml:space="preserve">  --ds-semantic-action: var(--ds-palette-blue-500);</text>
    <text x="20" y="452" fill="#bb9af7" xml:space="preserve">  --ds-semantic-action-hover: var(--ds-palette-blue-600);</text>
    <text x="20" y="472" fill="#bb9af7" xml:space="preserve">  --ds-semantic-on-action: #ffffff;</text>
    <text x="20" y="492" fill="#bb9af7" xml:space="preserve">  --ds-spacing-xs: 4px;</text>
    <text x="20" y="512" fill="#bb9af7" xml:space="preserve">  --ds-spacing-sm: 8px;</text>
  </g>
</svg>
