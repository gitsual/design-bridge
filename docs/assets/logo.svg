<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="design-bridge logo: a suspension bridge whose cable runs from a Figma-coloured tower to a blue code-coloured tower">
  <defs>
    <linearGradient id="dbCable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f24e1e"/>
      <stop offset="0.45" stop-color="#a259ff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="#11141b"/>

  <!-- cable -->
  <path d="M26 26 Q48 62 70 26" fill="none" stroke="url(#dbCable)" stroke-width="5" stroke-linecap="round"/>

  <!-- hangers -->
  <g stroke="#3f4655" stroke-width="2.5" stroke-linecap="round">
    <line x1="35" y1="40" x2="35" y2="62"/>
    <line x1="48" y1="49" x2="48" y2="62"/>
    <line x1="61" y1="40" x2="61" y2="62"/>
  </g>

  <!-- towers -->
  <rect x="22.5" y="22" width="7" height="42" rx="3.5" fill="#f24e1e"/>
  <rect x="66.5" y="22" width="7" height="42" rx="3.5" fill="#3b82f6"/>

  <!-- deck -->
  <rect x="12" y="60" width="72" height="8" rx="4" fill="#d6dae4"/>

  <!-- piers -->
  <g fill="#79839a">
    <rect x="23" y="68" width="6" height="12" rx="3"/>
    <rect x="45" y="68" width="6" height="12" rx="3"/>
    <rect x="67" y="68" width="6" height="12" rx="3"/>
  </g>
</svg>
